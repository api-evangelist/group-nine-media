name: Group Nine Media
description: 'Group Nine Media was a New York-based digital-media holding company formed in 2016 through
  the merger of Discovery Digital with the original Group Nine, uniting the news brand NowThis, the animal
  brand The Dodo, the lifestyle brand Thrillist, and the science brand Seeker under one roof (it later
  added PopSugar). Backed by Discovery Inc. and venture investor IVP, it built large social-video and
  branded-content audiences before it was acquired by Vox Media in February 2022 and folded into that
  portfolio. Group Nine operated as a consumer media publisher, not an API provider: it did not publish
  a public developer portal, API documentation, SDKs, or any machine-readable API surface, and its
  groupnine.com domain now resolves to a third-party domain-sale landing page. This profile is retained
  as a VC-portfolio identity record with no scorable API artifacts.'
